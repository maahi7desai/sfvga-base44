<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="description" content="San Fernando Valley Gujarati Association (SFVGA) — a Southern California non-profit organization since 1978. Preserving heritage and promoting culture. Community events including Sanskriti Divas, Navratri, and Dipotsav (Diwali)." />
    <meta name="theme-color" content="#D45920" />
    <meta property="og:title" content="SFVGA — San Fernando Valley Gujarati Association" />
    <meta property="og:description" content="A Southern California non-profit organization since 1978. Preserve heritage and promote culture — a vibrant Gujarati community in the heart of SoCal." />
    <meta property="og:type" content="website" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <title>SFVGA — San Fernando Valley Gujarati Association</title>
    <script>
      // Paint the system theme before React mounts so there is no light flash.
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && systemDark);
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
